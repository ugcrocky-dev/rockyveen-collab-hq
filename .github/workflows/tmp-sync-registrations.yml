name: tmp-sync-registrations
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified full registrations.js
        run: |
          curl -fsSL 'https://h.uguu.se/QlLeSXbz.js' -o src/registrations.js
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/registrations.js').read_text(encoding='utf-8')
          assert len(t) > 20000
          assert 'export const platforms' in t
          assert '16:22 impact-unlock-retry' in t
          assert 'get.descript.com/o5bc1tsufdv4' in t
          assert 'PLACEHOLDER' not in t
          print('verified', len(t))
          PY
      - name: Commit and push
        run: |
          git config user.name 'Rocky Veen'
          git config user.email 'collabs@rockyveen.com'
          git add src/registrations.js
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m 'chore: ~16:22 impact-unlock-retry — still locked; no login'
          git push origin HEAD:main
