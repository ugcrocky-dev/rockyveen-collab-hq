name: restore-rak0252-oct26
on:
  push:
    paths:
      - .github/workflows/restore-rak0252-oct26.yml
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact registrations.js
        run: |
          set -euo pipefail
          curl -fsSL -o src/registrations.js "https://d.uguu.se/hTsJOAGO.js"
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" -eq 37808
          test "$(grep -o '2026-10-26 ~02:52 poll-rakuten-more-saas' src/registrations.js | wc -l)" -eq 8
          test "$(grep -o 'through ~02:52 Oct 26' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~02:52' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~22:52' src/registrations.js | wc -l)" -eq 0
          test "$(grep -o 'as of this ~18:52' src/registrations.js | wc -l)" -eq 0
          test "$(grep -o 'o5bc1tsufdv4' src/registrations.js | wc -l)" -ge 2
          test "$(grep -o 'rocky25' src/registrations.js | wc -l)" -eq 2
          ! grep -q PLACEHOLDER src/registrations.js
      - name: Commit and push main + feature branch
        run: |
          set -euo pipefail
          git config user.name ugcrocky-dev
          git config user.email ugcrocky@gmail.com
          MSG='2026-10-26 ~02:52 poll-rakuten-more-saas: OOO after OTP~19:42/Imp~17:49; 0 new Partnered; as of this ~02:52'
          git add src/registrations.js
          if git diff --cached --quiet; then
            echo "no content change on checked-out ref"
          else
            git commit -m "$MSG"
          fi
          git push origin HEAD:main
          git push origin HEAD:cursor/rak-0252-oct26-595e
