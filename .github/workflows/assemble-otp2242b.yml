name: assemble-otp2242b
on:
  push:
    branches: [cursor/otp-2242b-oct24-595e]
    paths: [.tmp/otp2242b/DONE]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/otp-2242b-oct24-595e
      - name: Assemble registrations.js from base64 chunks
        run: |
          set -euo pipefail
          cat .tmp/otp2242b/b64/c0 .tmp/otp2242b/b64/c1 .tmp/otp2242b/b64/c2 .tmp/otp2242b/b64/c3 .tmp/otp2242b/b64/c4 .tmp/otp2242b/b64/c5 .tmp/otp2242b/b64/c6 .tmp/otp2242b/b64/c7 .tmp/otp2242b/b64/c8 .tmp/otp2242b/b64/c9 .tmp/otp2242b/b64/c10 .tmp/otp2242b/b64/c11 .tmp/otp2242b/b64/c12 .tmp/otp2242b/b64/c13 .tmp/otp2242b/b64/c14 .tmp/otp2242b/b64/c15 .tmp/otp2242b/b64/c16 .tmp/otp2242b/b64/c17 .tmp/otp2242b/b64/c18 .tmp/otp2242b/b64/c19 .tmp/otp2242b/b64/c20 .tmp/otp2242b/b64/c21 .tmp/otp2242b/b64/c22 .tmp/otp2242b/b64/c23 .tmp/otp2242b/b64/c24 .tmp/otp2242b/b64/c25 | base64 -d > src/registrations.js
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" = "37800"
          STAMP=$(grep -o '2026-10-24 ~22:42 poll-collab-otp-tight' src/registrations.js | wc -l)
          test "$STAMP" = "8"
          test "$(grep -c 'through ~22:42 Oct 24' src/registrations.js)" = "1"
          test "$(grep -c 'as of this ~02:52' src/registrations.js)" = "1"
          test "$(grep -c '2026-10-25 ~02:52 poll-rakuten-more-saas' src/registrations.js || true)" = "0"
      - name: Commit
        run: |
          git config user.name ugcrocky-dev
          git config user.email ugcrocky@gmail.com
          git add src/registrations.js
          git commit -m "2026-10-24 ~22:42 poll-collab-otp-tight: OOO after Rak~02:52 Oct 25; 0 unlock; keep Daily Digest; as of this ~02:52" || echo "no change"
          git push origin HEAD:cursor/otp-2242b-oct24-595e
