name: assemble-rak0252b
on:
  push:
    branches: [cursor/rakuten-0252b-oct25-595e]
    paths: [.tmp/rak0252b/DONE]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/rakuten-0252b-oct25-595e
      - name: Assemble registrations.js
        run: |
          set -euo pipefail
          cat .tmp/rak0252b/part0 .tmp/rak0252b/part1 .tmp/rak0252b/part2 .tmp/rak0252b/part3 \
              .tmp/rak0252b/part4 .tmp/rak0252b/part5 .tmp/rak0252b/part6 .tmp/rak0252b/part7 \
            > src/registrations.js
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" = "37808"
          STAMP=$(grep -o '2026-10-25 ~02:52 poll-rakuten-more-saas' src/registrations.js | wc -l)
          test "$STAMP" = "8"
          test "$(grep -c 'through ~02:52 Oct 25' src/registrations.js)" = "1"
          test "$(grep -c 'as of this ~02:52' src/registrations.js)" = "1"
          test "$(grep -c '2026-10-24 ~21:42 poll-collab-otp-tight' src/registrations.js || true)" = "0"
      - name: Commit
        run: |
          git config user.name ugcrocky-dev
          git config user.email ugcrocky@gmail.com
          git add src/registrations.js
          git commit -m "2026-10-25 ~02:52 poll-rakuten-more-saas: catch-up; 0 new Partnered; keep Wondershare/Webroot; as of this ~02:52" || echo "no change"
          git push origin HEAD:cursor/rakuten-0252b-oct25-595e
