name: restore-registrations
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push full local registrations.js from verified mirror
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/MjmggZGo.js" -o src/registrations.js
          python3 - <<'PY'
          from pathlib import Path
          c = Path('src/registrations.js').read_text()
          assert len(c) > 20000, len(c)
          assert 'export const platforms' in c
          assert '15:12 poll-collab-otp-tight' in c
          assert 'get.descript.com/o5bc1tsufdv4' in c
          assert 'PLACEHOLDER' not in c
          print('OK', len(c))
          PY
          git config user.name "ugcrocky-dev"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registrations.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: ~15:12 poll-collab-otp-tight — no new unlocks; Descript won held"
          git push
