name: restore-otp2242-oct26
on:
  push:
    paths:
      - .github/workflows/restore-otp2242-oct26.yml
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact registrations.js
        run: |
          set -euo pipefail
          curl -fsSL -o src/registrations.js "https://d.uguu.se/KyreTSCv.js"
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" -eq 37800
          test "$(grep -o '2026-10-26 ~22:42 poll-collab-otp-tight' src/registrations.js | wc -l)" -eq 8
          test "$(grep -o 'through ~22:42 Oct 26' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~02:52' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~22:52' src/registrations.js | wc -l)" -eq 0
          test "$(grep -o 'o5bc1tsufdv4' src/registrations.js | wc -l)" -eq 5"
