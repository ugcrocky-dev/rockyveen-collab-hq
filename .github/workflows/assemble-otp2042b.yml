name: assemble-otp2042b
on:
  push:
    branches: [cursor/otp-2042b-oct24-595e]
    paths: [.tmp/otp2042b/DONE]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/otp-2042b-oct24-595e
      - name: Assemble registrations.js
        run: |
          set -euo pipefail
          cat .tmp/otp2042b/part0 .tmp/otp2042b/part1 .tmp/otp2042b/part2 .tmp/otp2042b/part3 \
              .tmp/otp2042b/part4 .tmp/otp2042b/part5 .tmp/otp2042b/part6 .tmp/otp2042b/part7 \
            > src/registrations.js
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" = "37800"
          STAMP=$(grep -o '2026-10-24 ~20:42 poll-collab-otp-tight' src/registrations.js | wc -l)
          test "$STAMP" = "8"
          test "$(grep -c 'through ~20:42 Oct 24' src/registrations.js)" = "1"
          test "$(grep -c 'as of this ~22:52' src/registrations.js)" = "1"
      - name: Commit
        run: |
          git config user.name ugcrocky-dev
          git config user.email ugcrocky@gmail.com
          git add src/registrations.js
          git commit -m "2026-10-24 ~20:42 poll-collab-otp-tight: catch-up OOO after Rak~22:52; 0 unlock; keep Daily Digest; as of this ~22:52" || echo "no change"
          git push origin HEAD:cursor/otp-2042b-oct24-595e
