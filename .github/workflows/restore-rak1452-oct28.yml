name: restore-rak1452-oct28
on:
  push:
    paths:
      - .github/workflows/restore-rak1452-oct28.yml
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact registrations.js
        run: |
          set -euo pipefail
          curl -fsSL -o src/registrations.js "https://h.uguu.se/YzcohdMN.js"
          BYTES=$(wc -c < src/registrations.js)
          echo "bytes=$BYTES"
          test "$BYTES" -eq 37808
          test "$(grep -o '2026-10-28 ~14:52 poll-rakuten-more-saas' src/registrations.js | wc -l)" -eq 8
          test "$(grep -o 'through ~14:52 Oct 28' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~14:52' src/registrations.js | wc -l)" -eq 1
          test "$(grep -o 'as of this ~10:52' src/registrations.js | wc -l)" -eq 0
          test "$(grep -o 'o5bc1tsufdv4' src/registrations.js | wc -l)" -ge 2
          test "$(grep -o 'rocky25' src/registrations.js | wc -l)" -eq 2
          ! grep -q PLACEHOLDER src/registrations.js
      - name: Commit and push main + feature branch
        run: |
          set -euo pipefail
          git config user.name ugcrocky-dev
          git config user.email ugcrocky@gmail.com
          MSG='2026-10-28 ~14:52 poll-rakuten-more-saas: OOO after OTP~04:42; refresh as of this ~14:52; 0 unlock; keep Daily Digest'
          git add src/registrations.js
          if git diff --cached --quiet; then
            echo "no content change on checked-out ref"
          else
            git commit -m "$MSG"
          fi
          git push origin HEAD:main
          git push origin HEAD:cursor/rak-1452-oct28-595e
